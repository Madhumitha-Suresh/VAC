<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Date and Time Box */
        .calendar {
            background: #6c63ff;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        #day {
            font-size: 22px;
            font-weight: bold;
        }

        #date {
            font-size: 30px;
            margin: 8px 0;
        }

        #time {
            font-size: 22px;
        }

        /* Input area */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        #addButton {
            padding: 12px 20px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #addButton:hover {
            background: #5148e5;
        }

        /* Task list */
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        li input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        li span {
            flex: 1;
            font-size: 17px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            border: none;
            background: #ff5252;
            color: white;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        /* Appreciation message */
        #appreciation {
            display: none;
            text-align: center;
            font-size: 24px;
            margin-top: 15px;
            color: #ff5722;
            font-weight: bold;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Cracker/confetti */
        .cracker {
            position: fixed;
            font-size: 30px;
            animation: explode 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }

            50% {
                transform: translate(var(--x), var(--y)) scale(1.5);
                opacity: 1;
            }

            100% {
                transform: translate(var(--x), var(--y)) scale(0.5);
                opacity: 0;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>📝 My To-Do List</h1>

    <!-- Calendar -->
    <div class="calendar">
        <div id="day"></div>
        <div id="date"></div>
        <div id="time"></div>
    </div>

    <h2>Today's Tasks</h2>

    <!-- Add Task -->
    <div class="input-area">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
        >

        <button id="addButton" onclick="addTask()">
            Add Task
        </button>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>

    <!-- Appreciation -->
    <div id="appreciation">
        🎉 Great Job! Task Completed! 🎉
    </div>

</div>


<script>

    // ------------------------------
    // DATE, DAY, YEAR AND LIVE TIME
    // ------------------------------

    function updateDateTime() {

        const now = new Date();

        const days = [
            "Sunday",
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday"
        ];

        const months = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];

        // Day
        document.getElementById("day").innerHTML =
            days[now.getDay()];

        // Date Month Year
        document.getElementById("date").innerHTML =
            now.getDate() + " " +
            months[now.getMonth()] + " " +
            now.getFullYear();

        // Live Time
        document.getElementById("time").innerHTML =
            now.toLocaleTimeString();
    }

    updateDateTime();

    // Update every second
    setInterval(updateDateTime, 1000);


    // ------------------------------
    // ADD TASK
    // ------------------------------

    function addTask() {

        const taskInput =
            document.getElementById("taskInput");

        const taskText =
            taskInput.value.trim();

        if (taskText === "") {
            alert("Please enter a task!");
            return;
        }

        // Create list item
        const li =
            document.createElement("li");

        // Create checkbox
        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        // Create task text
        const span =
            document.createElement("span");

        span.innerText = taskText;

        // Delete button
        const deleteButton =
            document.createElement("button");

        deleteButton.innerText = "Delete";
        deleteButton.className = "delete-btn";


        // When checkbox is clicked
        checkbox.addEventListener(
            "change",
            function () {

                if (checkbox.checked) {

                    span.classList.add("completed");

                    showAppreciation();

                    crackers();

                } else {

                    span.classList.remove("completed");

                }
            }
        );


        // Delete task
        deleteButton.onclick = function () {

            li.remove();

        };


        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);

        document
            .getElementById("taskList")
            .appendChild(li);


        // Clear input
        taskInput.value = "";

    }


    // ------------------------------
    // APPRECIATION MESSAGE
    // ------------------------------

    function showAppreciation() {

        const message =
            document.getElementById("appreciation");

        message.style.display = "block";

        setTimeout(function () {

            message.style.display = "none";

        }, 2500);

    }


    // ------------------------------
    // CRACKER / CONFETTI EFFECT
    // ------------------------------

    function crackers() {

        const emojis = [
            "🎉",
            "🎊",
            "✨",
            "⭐",
            "💥",
            "🥳"
        ];

        for (let i = 0; i < 30; i++) {

            const cracker =
                document.createElement("div");

            cracker.className = "cracker";

            cracker.innerText =
                emojis[
                    Math.floor(
                        Math.random() *
                        emojis.length
                    )
                ];

            cracker.style.left =
                "50%";

            cracker.style.top =
                "50%";

            cracker.style.setProperty(
                "--x",
                (Math.random() * 600 - 300) + "px"
            );

            cracker.style.setProperty(
                "--y",
                (Math.random() * 600 - 300) + "px"
            );

            document.body.appendChild(cracker);


            setTimeout(function () {

                cracker.remove();

            }, 1500);

        }

    }


    // Add task when Enter key is pressed
    document
        .getElementById("taskInput")
        .addEventListener(
            "keypress",
            function (event) {

                if (event.key === "Enter") {
                    addTask();
                }

            }
        );

</script>

</body>
</html>
